<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THARSOS — Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <div id="login-view" class="view active">
    <div class="login-box">
      <h1 class="wordmark">THARSOS</h1>
      <p class="subtitle">Admin Portal Access</p>
      <form id="login-form" novalidate>
        <div class="form-group"><label for="email">Email</label><input type="email" id="email" required></div>
        <div class="form-group"><label for="password">Password</label><input type="password" id="password" required></div>
        <button type="submit" class="btn btn-solid btn-full" id="login-btn">Login</button>
      </form>
      <p id="login-error" class="error-msg"></p>
    </div>
  </div>

  <div id="admin-view" class="view">
    <header class="admin-header">
      <div class="header-inner">
        <div class="header-left"><h1 class="wordmark">THARSOS</h1><span class="badge">ADMIN</span></div>
        <div class="header-right"><button id="logout-btn" class="btn btn-ghost">Logout</button></div>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-tabs">
        <button class="tab-btn active" data-tab="tab-products">Products</button>
        <button class="tab-btn" data-tab="tab-collections">Collections</button>
        <button class="tab-btn" data-tab="tab-settings">Site Settings</button>
      </div>

      <div class="admin-content">
        <!-- PRODUCTS TAB -->
        <div id="tab-products" class="tab-pane active">
          <div class="admin-container">
            <div class="admin-header-text"><h2 id="product-form-title">Add New Product</h2></div>
            <form id="product-form">
              <input type="hidden" id="edit-product-id">
              
              <div class="form-row">
                <div class="form-group"><label for="prod-name">Product Name</label><input type="text" id="prod-name" required></div>
                <div class="form-group"><label for="prod-price">Price ($)</label><input type="number" id="prod-price" required></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label for="prod-sale">Sale Price ($)</label><input type="number" id="prod-sale"></div>
                <div class="form-group"><label for="prod-status">Status</label><select id="prod-status"><option value="in-stock">In Stock</option><option value="preorder">Pre-Order</option></select></div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="prod-collection">Collection</label>
                  <select id="prod-collection"><option value="">None (Standalone)</option></select>
                </div>
                <div class="form-group" style="display: flex; align-items: center; margin-top: 28px;">
                  <input type="checkbox" id="prod-bestseller" style="width: 20px; height: 20px; margin-right: 10px;">
                  <label for="prod-bestseller" style="margin-bottom: 0; cursor: pointer;">Mark as Bestseller</label>
                </div>
              </div>
              <div class="form-group"><label for="prod-desc">Short Description</label><input type="text" id="prod-desc" required></div>
              <div class="form-group"><label for="prod-details">Full Details</label><textarea id="prod-details" rows="3" required></textarea></div>
              
              <div class="form-group" style="background: #f9f9f9; padding: 16px; border: 1px solid var(--border);">
                <label>Printful Sync Variant IDs</label>
                <div class="form-row" style="gap: 12px;">
                  <div><label for="var-s">Size S</label><input type="text" id="var-s"></div>
                  <div><label for="var-m">Size M</label><input type="text" id="var-m"></div>
                  <div><label for="var-l">Size L</label><input type="text" id="var-l"></div>
                  <div><label for="var-xl">Size XL</label><input type="text" id="var-xl"></div>
                </div>
              </div>
              <div class="form-group">
                <label for="prod-image">Upload Images</label>
                <input type="file" id="prod-image" accept="image/*" multiple>
                <div id="existing-images" style="display: flex; gap: 10px; margin-top: 10px;"></div>
              </div>
              <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-solid" style="flex: 1;" id="submit-btn">Publish Product</button>
                <button type="button" class="btn btn-ghost" id="cancel-edit-btn" style="display: none;">Cancel</button>
              </div>
            </form>
          </div>
          <div class="admin-container" style="margin-top: 32px;"><h2>Existing Products</h2><div id="admin-product-list" style="margin-top: 24px;"></div></div>
        </div>

        <!-- COLLECTIONS TAB -->
        <div id="tab-collections" class="tab-pane">
          <div class="admin-container">
            <div class="admin-header-text"><h2>Manage Collections</h2></div>
            <form id="collection-form">
              <div class="form-group"><label for="col-name">Collection Name</label><input type="text" id="col-name" required></div>
              <div class="form-group"><label for="col-desc">Description</label><input type="text" id="col-desc" required></div>
              <div class="form-group"><label for="col-banner">Banner Image</label><input type="file" id="col-banner" accept="image/*" required></div>
              <button type="submit" class="btn btn-solid btn-full" id="col-submit-btn">Create Collection</button>
            </form>
          </div>
          <div class="admin-container" style="margin-top: 32px;"><h2>Existing Collections</h2><div id="admin-collection-list" style="margin-top: 24px;"></div></div>
        </div>

        <!-- SETTINGS TAB -->
        <div id="tab-settings" class="tab-pane">
          <div class="admin-container">
            <div class="admin-header-text"><h2>Site Settings</h2></div>
            <form id="settings-form">
              <div class="form-group">
                <label><input type="checkbox" id="toggle-clearance"> Show Clearance in Navigation</label>
              </div>
              
              <div style="border-top: 1px solid var(--border); padding-top: 20px; margin-top: 20px;">
                <h3>Homepage Hero Banner</h3>
                <div class="form-group">
                  <label for="hero-type">What should the homepage display?</label>
                  <select id="hero-type">
                    <option value="carousel">Image Carousel (Upload below)</option>
                    <option value="collection">Specific Collection</option>
                  </select>
                </div>
                
                <div id="hero-collection-settings" style="display: none; background: #f9f9f9; padding: 16px; margin-bottom: 20px;">
                  <div class="form-group">
                    <label for="hero-collection-select">Choose Collection</label>
                    <select id="hero-collection-select"></select>
                  </div>
                  <div class="form-group"><label for="hero-title">Hero Title</label><input type="text" id="hero-title" placeholder="Shop the New St. Joseph Collection"></div>
                  <div class="form-group"><label for="hero-btn">Button Text</label><input type="text" id="hero-btn" placeholder="Shop Now"></div>
                </div>

                <div id="hero-carousel-settings">
                  <div class="form-group">
                    <label for="carousel-images">Upload Carousel Images</label>
                    <input type="file" id="carousel-images" accept="image/*" multiple>
                  </div>
                </div>
              </div>

              <button type="submit" class="btn btn-solid btn-full" id="settings-btn" style="margin-top: 24px;">Save Settings</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="app.js?v=13"></script>
</body>
</html>
